[package]
name = "claude-governor"
version = "0.1.1"
edition = "2021"
description = "Automated capacity governor for Claude Code subscription usage"
authors = ["Claude Governor Team"]

[lib]
name = "claude_governor"
path = "src/lib.rs"

[[bin]]
name = "cgov"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP client with rustls (no native-tls)
ureq = { version = "2", features = ["tls"] }
rustls = "0.23"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Home directory
dirs = "6"

# File discovery
glob = "0.3"

# SQLite (bundled = compiled in, no system lib needed)
rusqlite = { version = "0.31", features = ["bundled"] }

# Signal handling for daemon mode
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
# Testing
tempfile = "3"
mockito = "1"

[profile.dev]
# Line tables only: panics and backtraces keep file:line frames, but
# variable/type-level DWARF is dropped (~78% of dev/test binary bytes;
# claudego-faef32af). Lanes that need full DWARF can set
# CARGO_PROFILE_DEV_DEBUG=2 for a single invocation.
debug = "line-tables-only"

[profile.release]
# Optimize for size and speed
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
